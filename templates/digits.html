<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Klasyfikator odręcznych cyfr</title>
</head>
<body>
    <h1>Klasyfikator odręcznych cyfr</h1>
    <form action="/" method="post" enctype="multipart/form-data">
        <input type="file" name="image" accept="image/*" required><br>
        <button>Predykcja</button>
    </form>
    {% if predict in range(0,10) %}
        <p>Prawdopodobna cyfra: {{ predict }}</p>
    {% endif %}
</body>
</html>
