<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Klasyfikator Irysów</title>
</head>
<body>
    <h1>Klasyfikator Irysów</h1>
    <form action="/" method="post">
        <p>Sepal lenght: <input name="sl" type="number" step="0.1" min="0" max="10" required></p>
        <p>Sepal width: <input name="sw" type="number" step="0.1" min="0" max="10" required></p>
        <p>Petal lenght: <input name="pl" type="number" step="0.1" min="0" max="10" required></p>
        <p>Petal width: <input name="pw" type="number" step="0.1" min="0" max="10" required></p>
        <button>Predykcja</button>
    </form>
</body>
</html>
